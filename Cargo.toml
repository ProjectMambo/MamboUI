[package]
name = "mambo-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared ratatui components for Project Mambo terminal applications"
license = "MIT"
repository = "https://github.com/ProjectMambo/MamboUI"
readme = "README.md"
keywords = ["ratatui", "terminal", "tui", "ui"]
categories = ["command-line-interface"]

[dependencies]
ratatui = "0.29"

[dev-dependencies]
crossterm = "0.28"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
